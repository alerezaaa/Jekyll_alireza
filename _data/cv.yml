cv:
  name: Alireza Dehghanzadeh
  label: Smart Agriculture and Computer Science Enthusiast
  email: dehghanzadeh98@gmail.com
  location: Karaj, Alborz, Iran
  image: "ali.jpg"
  summary: Resourceful engineer who enjoys coding, exploration, and solving real-world problems through creative, practical thinking. Especially interested in applied research and development, using machine learning, computer vision, and software tools to turn technical ideas into reliable, deployable solutions. Holds an M.Sc. from the University of Tehran with a thesis on machine learning for computational imaging — refinement of reconstructions of ECT, an ill-posed inverse problem. Also experienced in co-developing a real-time computer vision system deployed into industrial operation on embedded Linux, and currently building deep-learning pipelines for crack detection in surface imagery.

