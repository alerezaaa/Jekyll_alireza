cv:
  name: Alireza Dehghanzadeh
  label: Machine Learning · Embedded Systems · Computer Vision
  email: dehghanzadeh98@gmail.com
  location: Tehran, Iran
  website: https://alirezad.ir
  image: "ali.jpg"
  summary: Resourceful engineer who enjoys coding, exploration, and solving real-world problems through creative, practical thinking. Especially interested in applied research and development, using machine learning, computer vision, and software tools to turn technical ideas into reliable, deployable solutions. Holds an M.Sc. in Biosystems Engineering from the University of Tehran with a thesis on machine learning for computational imaging — building MLP-based refinements of Electrical Capacitance Tomography (ECT) reconstructions. Experienced in developing hardware and computer-vision prototypes on Raspberry Pi and Arduino, and building cross-platform Python/Kivy applications.

  social_networks:
    - network: X
      username: digdert
    - network: GitHub
      username: alerezaaa
    - network: LinkedIn
      username: dehghanzadeh

  # address:
