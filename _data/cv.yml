    Projects:
      - name: Deep Learning for Surface Crack Segmentation
        summary: Independent project developing a PyTorch-based pipeline for detecting cracks in concrete-surface images.
        highlights:
          - Developing a PyTorch-based pipeline for detecting cracks in concrete-surface images.
          - Using the Kaggle Surface Crack Detection dataset to build foundational computer-vision and deep-learning skills, with plans to extend the work toward pixel-level segmentation.
          - <b>Skills&#58;</b> PyTorch, Computer Vision, Deep Learning
        start_date: 2026-07-01
        end_date: present

      - name: Shrimp Aquaculture Data-Entry App
        summary: CS50x Final Project; first release of a broader aquaculture-management system. A Python/Kivy mobile application for recording shrimp-farming data and storing records locally in SQLite.
        highlights:
          - Completed a Python/Kivy mobile application for recording shrimp-farming data and storing records locally in SQLite.
